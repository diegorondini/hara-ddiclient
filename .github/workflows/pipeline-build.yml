name: build-action
on:
    push:
      branches-ignore:
        - 'gh-pages'
    pull_request:
      branches-ignore:
        - 'gh-pages'

jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-15-intel, windows-latest]
        runs-on: ${{matrix.os}}
        steps:
        - name: Check repository
          uses: actions/checkout@v5


        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v3

        #Run only on macOS
        - name: Setup Docker on macOS
          if: ${{ matrix.os == 'macos-15-intel' && github.event_name == 'pull_request' }}
          uses: douglascamata/setup-docker-macos-action@v1.1.0

        - name: Set up JDK 17
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: 17

        - name: Cache SonarQube packages
          uses: actions/cache@v4
          with:
            path: ~/.sonar/cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar

        - name: Cache Gradle packages
          uses: actions/cache@v4
          with:
            path: ~/.gradle/caches
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
            restore-keys: ${{ runner.os }}-gradle

        - name: TEMP diagnose hawkBit latency
          if: ${{ matrix.os == 'macos-15-intel' && github.event_name == 'pull_request' }}
          run: |
              ./gradlew waitingHawkbitServer
              for i in 1 2 3; do curl -s -o /dev/null --max-time 120 -w "host /UI/login %{http_code} %{time_total}s\n" http://localhost:8080/UI/login || echo "host /UI/login failed: $?"; done
              for i in 1 2 3 4; do curl -s -u test:test -o /dev/null --max-time 120 -w "host REST %{http_code} %{time_total}s\n" http://localhost:8080/rest/v1/system/configs || echo "host REST failed: $?"; done
              for i in 1 2; do docker run --rm --network container:test-update-server-1 curlimages/curl:latest -s -u test:test -o /dev/null --max-time 120 -w "container REST %{http_code} %{time_total}s\n" http://localhost:8080/rest/v1/system/configs || echo "container REST failed: $?"; done
              colima status || true
              VM_IP=$(colima list | awk '/default/ {print $NF}')
              echo "VM IP: $VM_IP"
              curl -s -o /dev/null --max-time 20 -w "VM IP /UI/login %{http_code} %{time_total}s\n" http://$VM_IP:8080/UI/login || echo "VM IP failed: $?"
              exit 1
          shell: bash

        #Build without test on Windows or macOS (when not a PR)
        - name: Gradle build
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_CLOUD_ORGANIZATION: ${{ vars.SONAR_CLOUD_ORGANIZATION }}
            SONAR_CLOUD_PROJECT_KEY: ${{ vars.SONAR_CLOUD_PROJECT_KEY }}
            SONAR_CLOUD_PROJECT_NAME: ${{ vars.SONAR_CLOUD_PROJECT_NAME }}
          run: |
              if [[ "$RUNNER_OS" == "Windows" || ( "$RUNNER_OS" == "macOS" && ${{ github.event_name }} != 'pull_request' ) ]]; then
                  ./gradlew build -x test
              elif [[ ${{ github.event_name }} == 'pull_request' && ${{ github.event.pull_request.head.repo.full_name != 'eclipse-hara/hara-ddiclient' }} == true ]]; then
                  ./gradlew --info build
              elif [[ -z "$SONAR_CLOUD_ORGANIZATION" ]]; then
                  ./gradlew --info build
              else
                  ./gradlew --info build sonar
              fi
          shell: bash

